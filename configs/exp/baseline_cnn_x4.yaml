project:
  stage: 1

seed: 42

data:
  dataset_name: emnist
  emnist_split: letters
  hr_size: 96
  scale: 4
  sr_factor: 4
  num_samples: 2000
  val_ratio: 0.1
  num_workers: 0
  root: outputs/cache/emnist

model:
  name: electronic_baseline
  latent_channels: 1

train:
  batch_size: 32
  epochs: 10
  lr: 0.001
  optimizer: adam

loss:
  name: l1
  weight: 1.0

eval:
  metrics:
    - psnr
    - ssim
  save_samples: true

runtime:
  download: false

output:
  dir: outputs/electronic_baseline/default_run
