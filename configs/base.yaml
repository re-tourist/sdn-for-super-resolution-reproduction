seed: 42
device: cuda
output_root: outputs

project:
  name: d2nn-superres-repro
  stage: 0
  task: super_resolution

data:
  dataset_name: placeholder
  root: data/processed
  train_split: data/splits/train.txt
  val_split: data/splits/val.txt
  test_split: data/splits/test.txt
  scale: 4
  num_channels: 3
  patch_size: 64
  augment: false
  num_workers: 4

model:
  name: placeholder
  in_channels: 3
  out_channels: 3

train:
  batch_size: 8
  epochs: 50
  lr: 0.0001
  weight_decay: 0.0
  optimizer: adam
  scheduler: none
  save_every: 5
  log_every: 50

loss:
  name: l1
  weight: 1.0

eval:
  metrics:
    - psnr
    - ssim
  save_images: true
  num_save_images: 8
  crop_border: 0
  color_space: rgb
  data_range: 1.0

runtime:
  mixed_precision: false
  cudnn_benchmark: true
  resume: null